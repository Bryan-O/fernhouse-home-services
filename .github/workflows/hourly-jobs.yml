# Calls the site's scheduled jobs (/api/cron) once an hour — a free stand-in for Vercel Cron,
# whose free plan only allows one run a day. Each run checks the Atlanta time and does what's due;
# see docs/scheduled-jobs.md. Needs two repository secrets (Settings → Secrets and variables →
# Actions): CRON_URL (https://<your-site>/api/cron) and CRON_SECRET (same value as on Vercel).
# Until both are set, each run just skips. GitHub runs schedules only from the default branch.
name: Hourly jobs

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL and CRON_SECRET aren't set yet — skipping."
            exit 0
          fi
          curl --fail-with-body -sS -m 90 -H "Authorization: Bearer $CRON_SECRET" "$CRON_URL"
